name: SMILE CI

permissions:
  contents: read

on:
  # Automatic triggers are intentionally paused during SMILE Velocity Mode.
  # Keep the full workflow manually available for milestones and releases.
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore SMILE.sln

      - name: Build Debug
        run: dotnet build SMILE.sln -c Debug --no-restore -nologo

      - name: Test Debug
        run: dotnet test SMILE.sln -c Debug --no-build --no-restore --filter "TestCategory!=HistoricalExactInput" -nologo

      - name: Build Release
        run: dotnet build SMILE.sln -c Release --no-restore -nologo

      - name: Test Release
        run: dotnet test SMILE.sln -c Release --no-build --no-restore --filter "TestCategory!=HistoricalExactInput" -nologo
